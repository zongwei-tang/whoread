<html><body style="font-family: -apple-system; font-size: 13px">
<h3>WhoRead</h3>
<p>WhoRead 记录哪些程序打开了你的敏感文件（SSH 密钥、各种令牌、浏览器 Cookie、密码管理器、聊天记录等），
以及是哪个 App 或 AI agent 启动了它们。</p>
<ul>
<li>它从不读取文件里的内容，也从不联网。</li>
<li>记录只保存在这台 Mac 上，放在只有 root 能读的文件夹里。</li>
<li>这个版本只记录和提醒，不拦截。</li>
</ul>
<p>会安装一个后台服务（以 root 身份运行）、菜单栏 App 和 <code>whoread</code> 命令。</p>
</body></html>
