# XcodeGen spec. Generate with:  scripts/xcodegen.sh   (writes Xcode/WhoRead.xcodeproj)
# Build with:                    scripts/build.sh [Debug|Release]
#
# Signing: set DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX in Xcode/Local.xcconfig (not committed),
# see Xcode/Local.xcconfig.example. Without a team, scripts/build.sh signs every target ad hoc
# and with no entitlements: the app runs against the dev daemon but cannot install the system
# extension, and the extension itself cannot run on a normal Mac. A team without the Endpoint
# Security capability yet builds with WHOREAD_NO_ES=1 (team-signed, no entitlements, same limits).
name: WhoRead
minimumXcodeGenVersion: 2.40.0
configFiles:
  Debug: Shared.xcconfig
  Release: Shared.xcconfig
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WhoReadKit:
    path: ..
    group: ""

targets:
  # Menu bar app. Runs as the user, talks to the daemon over XPC, never opens the database.
  WhoRead:
    type: application
    platform: macOS
    sources:
      - path: ../App/Sources
      - path: ../App/Resources
        buildPhase: resources
      - path: ../Data
        buildPhase: resources
        type: folder
        name: WhoReadData
    dependencies:
      - package: WhoReadKit
        products: [WhoReadCore, WhoReadIPC, WhoReadUIModel]
      - target: WhoReadExtension
      # The CLI ships team-signed in the app so it satisfies the extension's client requirement.
      # Not Contents/MacOS: on a case-insensitive volume "whoread" is the app's own executable.
      - target: whoread-cli
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: ../App/Info.plist
      properties:
        CFBundleDisplayName: WhoRead
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        NSHumanReadableCopyright: ""
        WhoReadMachServiceName: "$(WHOREAD_MACH_SERVICE)"
        WhoReadExtensionBundleID: "$(WHOREAD_EXTENSION_BUNDLE_ID)"
    entitlements:
      path: ../App/WhoRead.entitlements
      properties:
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).whoread"
        PRODUCT_NAME: WhoRead
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    scheme:
      environmentVariables: {}

  # Endpoint Security system extension (release form of the daemon). Needs the ES entitlement
  # (Apple approval for distribution; SIP disabled for development).
  WhoReadExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: ../Extension
        excludes: ["Info.plist", "*.entitlements"]
      - path: ../Data
        buildPhase: resources
        type: folder
        name: WhoReadData
    dependencies:
      - package: WhoReadKit
        product: WhoReadEngine
      - sdk: libEndpointSecurity.tbd
      - sdk: libbsm.tbd
    info:
      path: ../Extension/Info.plist
      properties:
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleDisplayName: WhoRead Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSystemExtensionUsageDescription: "WhoRead watches who opens your sensitive files (SSH keys, cloud credentials, browser data) and can block access you did not allow."
        NSEndpointSecurityMachServiceName: "$(WHOREAD_MACH_SERVICE)"
        NSEndpointSecurityEarlyBoot: false
        # Who may connect over XPC (the embedded CLI and the app), and which peer is the app (the only
        # non-root peer that may weaken protection). WHOREAD_SIGNING_ANCHOR differs per configuration
        # (below). Keep `leaf[subject.OU] = "$(DEVELOPMENT_TEAM)"` as is: without a team it expands to
        # `= ""`, and Extension/main.swift then drops both requirements.
        WhoReadClientRequirement: '(identifier "$(BUNDLE_ID_PREFIX).whoread.cli" or identifier "$(BUNDLE_ID_PREFIX).whoread") and $(WHOREAD_SIGNING_ANCHOR) and certificate leaf[subject.OU] = "$(DEVELOPMENT_TEAM)"'
        WhoReadAppRequirement: 'identifier "$(BUNDLE_ID_PREFIX).whoread" and $(WHOREAD_SIGNING_ANCHOR) and certificate leaf[subject.OU] = "$(DEVELOPMENT_TEAM)"'
    entitlements:
      path: ../Extension/WhoReadExtension.entitlements
      properties:
        com.apple.developer.endpoint-security.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WHOREAD_EXTENSION_BUNDLE_ID)"
        PRODUCT_NAME: "$(WHOREAD_EXTENSION_BUNDLE_ID)"
        SKIP_INSTALL: YES
        # Release (and any configuration but Debug): Developer ID only (Developer ID CA intermediate,
        # Developer ID Application leaf), and never code that other processes of the user can control:
        # no get-task-allow (debuggable), no library-validation or DYLD_* opt-outs (injectable).
        # scripts/release/release.sh checks the exported app and CLI against the requirements.
        WHOREAD_SIGNING_ANCHOR: 'anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and !(entitlement["com.apple.security.get-task-allow"] exists) and !(entitlement["com.apple.security.cs.disable-library-validation"] exists) and !(entitlement["com.apple.security.cs.allow-dyld-environment-variables"] exists)'
      configs:
        # Development path only: any certificate of the team, Apple Development included. Those builds
        # carry get-task-allow, so code running as the user can debug the very app a Debug extension
        # then trusts to weaken protection. Never rely on a Debug extension for protection.
        Debug:
          WHOREAD_SIGNING_ANCHOR: 'anchor apple generic'

  # Development daemon (LaunchDaemon form). Same engine; eslogger or native ES source.
  whoreadd:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/whoreadd
    dependencies:
      - package: WhoReadKit
        product: WhoReadEngine
      - sdk: libEndpointSecurity.tbd
      - sdk: libbsm.tbd
    entitlements:
      path: ../Extension/whoreadd.entitlements
      properties:
        com.apple.developer.endpoint-security.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).whoread.daemon"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES

  # Command line client (also embedded in the app as Contents/Helpers/whoread). The target is not
  # called "whoread": its build folders would then differ from the app's (WhoRead) only in case and
  # collide on a case-insensitive volume. The product keeps the name whoread.
  whoread-cli:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/whoread
    dependencies:
      - package: WhoReadKit
        product: WhoReadEngine
    settings:
      base:
        PRODUCT_NAME: whoread
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).whoread.cli"
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        # Embedded in WhoRead.app; installing it under usr/local/bin would make the archive generic.
        SKIP_INSTALL: YES
