# Builds and tests WhoRead on GitHub's macOS runners: SwiftPM build and tests, the dev-socket e2e,
# XcodeGen + xcodebuild of every target (ad hoc, no team), shellcheck. Endpoint Security blocking is
# not testable here (SIP is on and runners have no ES entitlement); that runs in a SIP-disabled VM.
#
# Each run also publishes a plain-text report per runner to the `ci-results` branch
# (results/<commit>/<runner>.txt), so the result can be read without signing in.
name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Hosted runners are free only for public repositories; a private copy runs nothing, so no
    # Actions minutes are ever used (macOS minutes count 10x on private repositories).
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is macOS 26; xcode-27 is GitHub's macOS 27 image (arm64). GitHub retired the
        # macOS 14 image on 2026-11-02: its jobs are cancelled before a runner is assigned, so macOS 14
        # is no longer tested here.
        os: [macos-15, macos-latest, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          x="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - name: Run CI checks
        id: ci
        run: scripts/ci/run-ci.sh "$RUNNER_TEMP/report.txt"
        continue-on-error: true
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/report.txt" 2>/dev/null | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP/${{ matrix.os }}.txt" 2>/dev/null || echo "no report" > "$RUNNER_TEMP/${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: ${{ runner.temp }}/${{ matrix.os }}.txt
          retention-days: 14
      - name: Fail the job when a check failed
        if: steps.ci.outcome != 'success'
        run: exit 1

  # Builds WhoRead.pkg (scripts/release/make-pkg.sh), installs it with installer(8), checks it and
  # removes it. With the repository secrets below it is signed with a Developer ID and notarized
  # (docs/DISTRIBUTION.md, "WhoRead.pkg"); without them it is built ad hoc and tested the same way.
  # The package is kept as the run's artifact "WhoRead-pkg".
  package:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    # Apple can keep a team's first notarizations "In Progress" for hours: after 20 minutes the signed package
    # is kept and reported as pending (WHOREAD_NOTARY_PENDING_OK in scripts/release/make-pkg.sh).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          x="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
      - name: Import the Developer ID certificates
        env:
          P12_APP: ${{ secrets.WHOREAD_DEVID_APP_P12_BASE64 }}
          P12_INSTALLER: ${{ secrets.WHOREAD_DEVID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.WHOREAD_DEVID_P12_PASSWORD }}
          NOTARY_P8: ${{ secrets.WHOREAD_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.WHOREAD_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.WHOREAD_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          # Repository secrets, one .p12 per certificate (docs/DISTRIBUTION.md).
          if [ -z "$P12_APP" ] || [ -z "$P12_INSTALLER" ]; then echo "no signing secrets: the package is built ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/whoread-signing.keychain-db"
          KCP="$(uuidgen)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          for p in "$P12_APP" "$P12_INSTALLER"; do
            printf '%s' "$p" | base64 -D > "$RUNNER_TEMP/devid.p12"
            security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild > /dev/null
            rm -f "$RUNNER_TEMP/devid.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          app="$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          inst="$(security find-identity -v "$KC" | sed -n 's/.*"\(Developer ID Installer: .*\)"$/\1/p' | head -1)"
          if [ -z "$app" ] || [ -z "$inst" ]; then
            echo "the .p12 must hold both a Developer ID Application and a Developer ID Installer certificate with their keys"
            echo "found: $(security find-identity -v "$KC" | grep -c '"') identities"
            exit 1
          fi
          {
            echo "WHOREAD_SIGN_APP=$app"
            echo "WHOREAD_SIGN_PKG=$inst"
            echo "WHOREAD_KEYCHAIN=$KC"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            printf '%s\n' "$NOTARY_P8" > "$RUNNER_TEMP/notary.p8"
            chmod 600 "$RUNNER_TEMP/notary.p8"
            {
              echo "WHOREAD_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "WHOREAD_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "WHOREAD_NOTARY_ISSUER=$NOTARY_ISSUER"
              echo "WHOREAD_NOTARY_TIMEOUT=20m"
              echo "WHOREAD_NOTARY_PENDING_OK=1"
            } >> "$GITHUB_ENV"
          else
            echo "no notarization secrets: the package is signed but not notarized"
          fi
      - name: Build, install and check the package
        id: pkg
        run: scripts/ci/package-ci.sh "$RUNNER_TEMP/package.txt" "$RUNNER_TEMP/pkg"
        continue-on-error: true
      - name: Summary
        if: always()
        run: |
          { echo '```'; head -300 "$RUNNER_TEMP/package.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/package.txt" "$RUNNER_TEMP/package-pkg.txt" 2>/dev/null || echo "no report" > "$RUNNER_TEMP/package-pkg.txt"
          rm -f "$RUNNER_TEMP/notary.p8"
          if [ -n "${WHOREAD_KEYCHAIN:-}" ]; then security delete-keychain "$WHOREAD_KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-package-pkg
          path: ${{ runner.temp }}/package-pkg.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.pkg.outcome == 'success'
        with:
          name: WhoRead-pkg
          path: |
            ${{ runner.temp }}/pkg/WhoRead-*.pkg
            ${{ runner.temp }}/pkg/notarization-pending.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Fail the job when a check failed
        if: steps.pkg.outcome != 'success'
        run: exit 1

  publish:
    needs: [test, package]
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lists the run's jobs, so that a runner that left no report is named in the index.
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Push the reports to the ci-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "whoread-ci"
          git config --global user.email "whoread-ci@users.noreply.github.com"
          git init -q out && cd out
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-results 2>/dev/null; then
            git checkout -q -b ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results
          fi
          mkdir -p "results/${GITHUB_SHA}"
          cp ../reports/*.txt "results/${GITHUB_SHA}/"
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for f in ../reports/*.txt; do echo "$(basename "$f" .txt): $(grep -E '^OVERALL:' "$f" || echo 'OVERALL: NO REPORT')"; done
            # Runners that uploaded nothing (cancelled before a runner was assigned, a retired image).
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
                --jq '.jobs[] | select(.name | startswith("test (")) | [(.name | ltrimstr("test (") | rtrimstr(")")), (.conclusion // .status)] | @tsv' \
              | while IFS="$(printf '\t')" read -r os state; do
                  [ -f "../reports/$os.txt" ] || echo "$os: OVERALL: NO REPORT (job $state)"
                done || echo "(could not list the run's jobs)"
          } > "results/${GITHUB_SHA}/index.txt"
          cp "results/${GITHUB_SHA}/index.txt" latest.txt
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA}"
          for i in 1 2 3; do
            git push -q origin HEAD:ci-results && break
            git fetch -q --depth 1 origin ci-results && git rebase -q FETCH_HEAD || true
          done
